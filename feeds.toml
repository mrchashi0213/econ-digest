[[feeds]]
name = "Google News: 経済"
url = "https://news.google.com/rss/search?q=%E7%B5%8C%E6%B8%88+OR+%E6%97%A5%E9%8A%80+OR+%E6%A0%AA%E4%BE%A1+when:2d&hl=ja&gl=JP&ceid=JP:ja"
region = "日本"
exclude = "株価・株式情報|株価チャート"

# 日経・ロイター日本語版は公式RSSがないため、Google News のサイト指定検索で取得
# require: タイトルに含まれるべき正規表現 / exclude: 除外する正規表現（ロイターの株価ページ等を除く）

[[feeds]]
name = "日経: 経済・市場"
url = "https://news.google.com/rss/search?q=site%3Anikkei.com+%E7%B5%8C%E6%B8%88+OR+%E9%87%91%E8%9E%8D+OR+%E6%A0%AA+OR+%E6%97%A5%E9%8A%80+OR+%E7%82%BA%E6%9B%BF+OR+%E9%87%91%E5%88%A9+when%3A2d&hl=ja&gl=JP&ceid=JP%3Aja"
region = "日本"

[[feeds]]
name = "日経: 全般"
url = "https://news.google.com/rss/search?q=site%3Anikkei.com+when%3A2d&hl=ja&gl=JP&ceid=JP%3Aja"
region = "日本"

[[feeds]]
